- slug: loadTable
  name: loadTable()
  cat_tag: Input / Files
  description: Loads a CSV or TSV file into a Table object.
  related:
  - saveTable
  syntax: loadTable(path, options)
  params:
  - name: path
    type: string
    desc: path to the file
  - name: options
    type: string
    desc: '"header" to treat first row as column names'
  returns: Table
  uth:
  - - runner/src/prelude.lua
    - "function loadTable(path, opts)\n  local f = io.open(path, \"rb\")\n  if not f then\n    f = io.open(\"data/\" .. tostring(path), \"rb\")\n    if not f then\n      io.stderr:write(\"loadTable: could not open \" .. tostring(path) .. \"\\n\")\n      return nil\n    end\n  end\n  local text = f:read(\"a\"):gsub(\"^\\xEF\\xBB\\xBF\", \"\")\n  f:close()\n  local header, sep = options(opts, path)\n  local t = createTable()\n  t.header = header\n  local pos, len = 1, #text\n  local first = true\n  while pos <= len do\n    local fields\n    fields, pos = record(text, pos, sep)\n    if first and header then\n      for i, title in ipairs(fields) do t.titles[i - 1] = title if t.index[title] == nil then t.index[title] = i - 1 end end\n      if #fields > t.columns then t.columns = #fields end\n    elseif not (#fields == 1 and fields[1] == \"\") then      -- skip blank lines\n      local row = {}\n      for i, v in ipairs(fields) do row[i - 1] = v end\n      t.data[t.count] = row\n      t.count\
      \ = t.count + 1\n      if #fields > t.columns then t.columns = #fields end\n    end\n    first = false\n  end\n  return t\nend"
