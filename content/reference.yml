- slug: print
  name: print()
  cat_tag: Output / Text Area
  description: Writes to the console. Does not add a newline. Accepts any type.
  related:
  - println
  syntax: print(v)
  params:
  - name: v
    type: any
    desc: the value to print
  returns: ''
  uth:
  - - runner/src/main.rs
    - "g.set(\"print\", lua.create_function(|lua, args: LuaMultiValue| {\n    let tostring: LuaFunction = lua.globals().get(\"tostring\")?;\n    let mut line: Vec<u8> = Vec::new();\n    for (i, v) in args.into_iter().enumerate() {\n        if i > 0 { line.push(b'\\t'); }\n        // bytes, not String: a Lua string doesn't have to be valid UTF-8\n        line.extend_from_slice(tostring.call::<_, LuaString>(v)?.as_bytes());\n    }\n    line.push(b'\\n');\n    let mut out = std::io::stdout().lock();\n    if out.write_all(&line).and_then(|_| out.flush()).is_err() {\n        // Nobody is reading any more: the IDE that started us is gone.\n        processing::exit_with(0);\n    }\n    Ok(())\n})?)?;"
