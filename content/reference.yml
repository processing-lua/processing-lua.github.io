- slug: thread
  name: thread()
  cat_tag: Structure
  description: Runs a function on a new detached thread. Accepts a lambda or function.
  related:
  - delay
  syntax: thread(fn)
  params:
  - name: fn
    type: function
    desc: the function to run on a separate thread
  returns: ''
  uth:
  - - runner/src/prelude.lua
    - "function thread(fn)\n  local f = type(fn) == \"function\" and fn or _G[fn]\n  if type(f) ~= \"function\" then error(\"thread() expects a function or the name of one\", 2) end\n  running[#running + 1] = coroutine.create(f)\nend"
