- slug: bezierPoint
  name: bezierPoint()
  cat_tag: Shape / Curves
  description: Evaluates the bezier at parameter t, returning a point on the curve.
  related:
  - bezier
  - bezierTangent
  syntax: bezierPoint(a, b, c, d, t)
  params:
  - name: a
    type: number
    desc: coordinate of first point
  - name: b
    type: number
    desc: coordinate of first control point
  - name: c
    type: number
    desc: coordinate of second control point
  - name: d
    type: number
    desc: coordinate of second point
  - name: t
    type: number
    desc: value between 0 and 1
  returns: number
  uth:
  - - runner/src/prelude.lua
    - "-- ── More math ─────────────────────────────────────────────────────────────\nfunction bezierPoint(a, b, c, d, t)\n  local u = 1 - t\n  return u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * c + t * t * t * d\nend"
- slug: bezierTangent
  name: bezierTangent()
  cat_tag: Shape / Curves
  description: Calculates the tangent of a point on a bezier curve.
  related:
  - bezier
  - bezierPoint
  syntax: bezierTangent(a, b, c, d, t)
  params:
  - name: a
    type: number
    desc: coordinate of first point
  - name: b
    type: number
    desc: coordinate of first control point
  - name: c
    type: number
    desc: coordinate of second control point
  - name: d
    type: number
    desc: coordinate of second point
  - name: t
    type: number
    desc: value between 0 and 1
  returns: number
  uth:
  - - runner/src/prelude.lua
    - "function bezierTangent(a, b, c, d, t)\n  local u = 1 - t\n  return 3 * u * u * (b - a) + 6 * u * t * (c - b) + 3 * t * t * (d - c)\nend"
