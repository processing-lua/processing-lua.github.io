entries:
- slug: BufferedReader_class
  name: BufferedReader
  cat_tag: Data / Composite
  description: Reads text from a file line by line. Create with createReader(). Close when done.
  related:
  - createReader
  - loadStrings
  syntax: local x = BufferedReader(...)
  params: []
  returns: BufferedReader
  methods:
  - sig: :readLine()
    desc: Reads and returns the next line as a string. Returns empty string at EOF.
  - sig: :close()
    desc: Closes the file
  uth: []
- slug: HashMap_class
  name: HashMap
  cat_tag: Data / Composite
  description: A templated key-value map. In Lua Mode, map and unordered_map from the standard library are often more idiomatic, but HashMap is available for Processing Java compatibility.
  related: []
  syntax: local x = HashMap(...)
  params: []
  returns: HashMap
  methods:
  - sig: :get(k)
    desc: Returns reference to value for key
  - sig: :remove(k)
    desc: Removes a key-value pair
  - sig: :size()
    desc: Returns number of entries
  - sig: :clear()
    desc: Removes all entries
  - sig: :values()
    desc: Returns a vector of all values
  uth: []
- slug: PFont_class
  name: PFont
  cat_tag: Data / Composite
  description: Datatype for storing fonts. Load with loadFont() or create with createFont().
  related:
  - loadFont
  - createFont
  - textFont
  syntax: local font = createFont("name", size)
  params: []
  returns: PFont
  methods: []
  uth: []
- slug: PGraphics_class
  name: PGraphics
  cat_tag: Data / Composite
  description: An off-screen graphics buffer. Create with createGraphics(). Draw into it with beginDraw()/endDraw(), then display with image().
  related:
  - createGraphics
  - image
  syntax: local pg = createGraphics(w, h)
  params: []
  returns: PGraphics
  methods:
  - sig: :beginDraw()
    desc: Start drawing to the buffer
  - sig: :endDraw()
    desc: Stop drawing to the buffer
  - sig: :background(r, g, b)
    desc: Clear the buffer
  - sig: :fill(r, g, b)
    desc: Set fill color
  - sig: :stroke(r, g, b)
    desc: Set stroke color
  - sig: :ellipse(x, y, w, h)
    desc: Draw ellipse
  - sig: :rect(x, y, w, h)
    desc: Draw rectangle
  uth: []
- slug: PImage_class
  name: PImage
  cat_tag: Data / Composite
  description: Datatype for storing and manipulating images. Load with loadImage() or create with createImage().
  related:
  - loadImage
  - createImage
  - image
  syntax: local img = loadImage("file.png")
  params: []
  returns: PImage
  methods:
  - sig: :loadPixels()
    desc: Load pixel data into pixels[]
  - sig: :updatePixels()
    desc: Update image from pixels[]
  - sig: :get(x, y)
    desc: Get pixel color at position
  - sig: :set(x, y, c)
    desc: Set pixel color at position
  - sig: :resize(w, h)
    desc: Resize the image
  - sig: :filter(mode)
    desc: Apply an image filter
  - sig: :mask(m)
    desc: Apply an alpha mask
  uth: []
- slug: PShader_class
  name: PShader
  cat_tag: Data / Composite
  description: Datatype for GLSL shaders. Load with loadShader() and apply with shader().
  related:
  - loadShader
  - shader_fn
  - resetShader
  syntax: local x = PShader(...)
  params: []
  returns: PShader
  methods:
  - sig: :set(name, v)
    desc: Set a uniform float
  - sig: :set(name, v)
    desc: Set a uniform int
  - sig: :set(name, x, y)
    desc: Set a uniform vec2
  - sig: :set(name, x, y, z)
    desc: Set a uniform vec3
  uth: []
- slug: PShape_class
  name: PShape
  cat_tag: Data / Composite
  description: Datatype for storing shapes. Load with loadShape() or build programmatically with createShape().
  related:
  - loadShape
  - createShape
  - shape
  syntax: local s = loadShape("file.svg")  -- or createShape()
  params: []
  returns: PShape
  methods:
  - sig: :getChild(i)
    desc: Get child shape by index
  - sig: :getChild(name)
    desc: Get child shape by name/id
  - sig: :getChildCount()
    desc: Number of children
  - sig: :getVertex(i)
    desc: Get vertex by index as PVector
  - sig: :getVertexCount()
    desc: Number of vertices
  - sig: :setVertex(i, x, y)
    desc: Set vertex position
  - sig: :disableStyle()
    desc: Ignore the shape's own fill/stroke
  - sig: :enableStyle()
    desc: Use the shape's own fill/stroke
  - sig: :setFill(r, g, b)
    desc: Set fill color
  - sig: :setStroke(r, g, b)
    desc: Set stroke color
  uth: []
- slug: PVector
  name: PVector
  cat_tag: Data / Composite
  description: A class to describe a two or three dimensional vector. Commonly used to represent position, velocity, or direction.
  related: []
  syntax: local v = createVector(x, y)
  params: []
  returns: PVector
  methods:
  - sig: :mag()
    desc: Magnitude (length) of the vector
  - sig: :magSq()
    desc: Magnitude squared
  - sig: :add(v)
    desc: Add another vector
  - sig: :sub(v)
    desc: Subtract another vector
  - sig: :mult(s)
    desc: Multiply by scalar
  - sig: :div(s)
    desc: Divide by scalar
  - sig: :normalize()
    desc: Normalize to unit length
  - sig: :limit(max)
    desc: Limit the magnitude
  - sig: :setMag(m)
    desc: Set the magnitude
  - sig: :dot(v)
    desc: Dot product
  - sig: :cross(v)
    desc: Cross product
  - sig: :dist(v)
    desc: Distance to another vector
  - sig: :heading()
    desc: Angle the vector makes with positive x-axis
  - sig: :angleBetween(v)
    desc: Angle between two vectors
  - sig: :lerp(v, t)
    desc: Interpolate towards another vector
  - sig: :rotate(angle)
    desc: Rotate by an angle (2D)
  - sig: :copy()
    desc: Return a copy
  - sig: :toString()
    desc: String representation
  uth: []
- slug: PrintWriter_class
  name: PrintWriter
  cat_tag: Data / Composite
  description: Writes text to a file. Create with createWriter(). Always call close() or flush() when done.
  related:
  - createWriter
  - saveStrings
  syntax: local x = PrintWriter(...)
  params: []
  returns: PrintWriter
  methods:
  - sig: :print(v)
    desc: Writes a value without a newline
  - sig: :println(v)
    desc: Writes a value followed by a newline
  - sig: :println()
    desc: Writes a blank line
  - sig: :flush()
    desc: Flushes the buffer to disk
  - sig: :close()
    desc: Closes the file
  uth: []
- slug: TableRow_class
  name: TableRow
  cat_tag: Data / Composite
  description: Represents a single row in a Table. Access values by column index or name.
  related:
  - Table_class
  - loadTable
  syntax: for row in t:rows() do ... end
  params: []
  returns: TableRow
  methods:
  - sig: :getString(i)
    desc: Gets value at column index as string
  - sig: :getString(col)
    desc: Gets value by column name as string
  - sig: :getInt(i)
    desc: Gets value at column index as int
  - sig: :getFloat(i)
    desc: Gets value at column index as float
  - sig: :setString(i, v)
    desc: Sets value at column index
  - sig: :setInt(i, v)
    desc: Sets value as int
  - sig: :setFloat(i, v)
    desc: Sets value as float
  uth: []
- slug: Table_class
  name: Table
  cat_tag: Data / Composite
  description: Stores data in rows and columns like a spreadsheet. Load with loadTable(). Column names are set by the header row.
  related:
  - loadTable
  - saveTable
  - TableRow_class
  syntax: local t = loadTable("data.csv", "header")
  params: []
  returns: Table
  methods:
  - sig: :addColumn(name)
    desc: Adds a column
  - sig: :addRow()
    desc: Adds a new row, returns reference
  - sig: :getRowCount()
    desc: Returns number of rows
  - sig: :getColumnCount()
    desc: Returns number of columns
  - sig: :getString(row, col)
    desc: Gets a cell value as string
  - sig: :getString(row, col)
    desc: Gets a cell value by column name
  - sig: :getInt(row, col)
    desc: Gets a cell value as int
  - sig: :getFloat(row, col)
    desc: Gets a cell value as float
  - sig: :setString(row, col, v)
    desc: Sets a cell value
  - sig: :setInt(row, col, v)
    desc: Sets a cell value as int
  - sig: :setFloat(row, col, v)
    desc: Sets a cell value as float
  - sig: :removeRow(i)
    desc: Removes a row
  - sig: :clearRows()
    desc: Removes all rows
  - sig: :getColumnIndex(name)
    desc: Returns index of a column by name
  uth: []
- slug: XML_class
  name: XML
  cat_tag: Data / Composite
  description: Represents an XML element. Load with loadXML() or parseXML(). Access children and attributes by name.
  related:
  - loadXML
  - parseXML
  - saveXML
  syntax: local x = loadXML("data.xml")
  params: []
  returns: XML
  methods:
  - sig: :getName()
    desc: Returns the name of the element
  - sig: :getContent()
    desc: Returns the text content of the element
  - sig: :setContent(c)
    desc: Sets the text content
  - sig: :addChild(name)
    desc: Adds a child element
  - sig: :getChild(i)
    desc: Gets child by index
  - sig: :getChild(name)
    desc: Gets child by tag name
  - sig: :getChildCount()
    desc: Returns number of children
  - sig: :getChildren(name)
    desc: Returns all children with given tag name
  uth: []
- slug: append
  name: append()
  cat_tag: Data / Array Functions
  description: Expands a vector by one element and adds value to the end.
  related:
  - concat
  - expand
  - shorten
  syntax: append(arr, val)
  params:
  - name: arr
    type: table
    desc: the vector to expand
  - name: val
    type: any
    desc: the value to add
  returns: table
  uth:
  - - runner/src/prelude.lua
    - function append(list, v) local t = {} for i, x in ipairs(list) do t[i] = x end t[#t + 1] = v return t end
- slug: arrayCopy
  name: arrayCopy()
  cat_tag: Data / Array Functions
  description: Copies the contents of one vector into another.
  related:
  - concat
  - subset
  syntax: arrayCopy(src, dst)
  params:
  - name: src
    type: table
    desc: source vector
  - name: dst
    type: table
    desc: destination vector
  returns: ''
  uth:
  - - runner/src/prelude.lua
    - "function arrayCopy(src, a, b, c, d)\n  if b == nil then for i, x in ipairs(src) do a[i] = x end return end   -- arrayCopy(src, dst)\n  if c == nil then for i = 1, b do a[i] = src[i] end return end           -- arrayCopy(src, dst, n)\n  for i = 0, d - 1 do b[c + i] = src[a + i] end                          -- arrayCopy(src, from, dst, to, n)\nend"
- slug: concat
  name: concat()
  cat_tag: Data / Array Functions
  description: Concatenates two vectors.
  related:
  - append
  - splice
  syntax: concat(a, b)
  params:
  - name: a
    type: table
    desc: first vector
  - name: b
    type: table
    desc: second vector
  returns: table
  uth:
  - - runner/src/prelude.lua
    - function concat(a, b) local t = {} for _, x in ipairs(a) do t[#t + 1] = x end for _, x in ipairs(b) do t[#t + 1] = x end return t end
- slug: expand
  name: expand()
  cat_tag: Data / Array Functions
  description: Increases the size of a vector. With no second argument, doubles the size.
  related:
  - append
  - shorten
  syntax: 'expand(arr)

    expand(arr, n)'
  params:
  - name: arr
    type: table
    desc: the vector to expand
  - name: n
    type: number
    desc: new size (optional, default doubles)
  returns: table
  uth:
  - - runner/src/prelude.lua
    - function expand(list, n) local t = {} for i, x in ipairs(list) do t[i] = x end return t end
- slug: reverse_arr
  name: reverse()
  cat_tag: Data / Array Functions
  description: Reverses the order of a vector.
  related:
  - sort_arr
  syntax: reverse(arr)
  params:
  - name: arr
    type: table
    desc: the vector to reverse
  returns: table
  uth:
  - - runner/src/prelude.lua
    - 'function reverse(list) local t = {} for i = #list, 1, -1 do t[#t + 1] = list[i] end return t end'
- slug: shorten
  name: shorten()
  cat_tag: Data / Array Functions
  description: Decreases a vector by one element. Removes the last element.
  related:
  - append
  - expand
  syntax: shorten(arr)
  params:
  - name: arr
    type: table
    desc: the vector to shorten
  returns: table
  uth:
  - - runner/src/prelude.lua
    - 'function shorten(list) local t = {} for i = 1, #list - 1 do t[i] = list[i] end return t end'
- slug: sort_arr
  name: sort()
  cat_tag: Data / Array Functions
  description: Sorts a vector in ascending order.
  related:
  - reverse_arr
  syntax: sort(arr)
  params:
  - name: arr
    type: table
    desc: the vector to sort
  returns: table
  uth:
  - - runner/src/prelude.lua
    - "function sort(list, n)\n  local t = {} for i, x in ipairs(list) do t[i] = x end\n  if n and n < #t then\n    local head = subset(t, 1, n) table.sort(head)\n    for i = 1, n do t[i] = head[i] end\n    return t\n  end\n  table.sort(t)\n  return t\nend"
- slug: splice
  name: splice()
  cat_tag: Data / Array Functions
  description: Inserts a value or vector of values into an existing vector at the given index.
  related:
  - concat
  - append
  syntax: splice(arr, val, i)
  params:
  - name: arr
    type: table
    desc: the source vector
  - name: val
    type: any
    desc: value to insert
  - name: i
    type: number
    desc: position to insert at
  returns: table
  uth:
  - - runner/src/prelude.lua
    - "function splice(list, v, at)\n  local t = {}\n  for i = 1, at - 1 do t[#t + 1] = list[i] end\n  if type(v) == \"table\" then for _, x in ipairs(v) do t[#t + 1] = x end else t[#t + 1] = v end\n  for i = at, #list do t[#t + 1] = list[i] end\n  return t\nend"
- slug: subset
  name: subset()
  cat_tag: Data / Array Functions
  description: Extracts an array of elements from an existing vector.
  related:
  - splice
  - append
  syntax: 'subset(arr, start)

    subset(arr, start, count)'
  params:
  - name: arr
    type: table
    desc: the source vector
  - name: start
    type: number
    desc: starting index
  - name: count
    type: number
    desc: number of elements (optional)
  returns: table
  uth:
  - - runner/src/prelude.lua
    - "function subset(list, start, count)\n  local t = {}\n  local stop = count and (start + count - 1) or #list\n  for i = start, math.min(stop, #list) do t[#t + 1] = list[i] end\n  return t\nend"
- slug: binary
  name: binary()
  cat_tag: Data / Conversion
  description: Converts an integer to a binary string representation (32 characters).
  related:
  - unbinary
  - hex
  syntax: binary(v)
  params:
  - name: v
    type: number
    desc: value to convert
  returns: string
  uth:
  - - runner/src/prelude.lua
    - "function binary(n, digits)\n  if math.type(n) ~= \"integer\" then n = math.floor(n) end\n  n = n & 0xFFFFFFFF\n  local s = \"\"\n  repeat s = (n & 1) .. s n = n >> 1 until n == 0\n  if digits and #s < digits then s = string.rep(\"0\", digits - #s) .. s end\n  if digits and #s > digits then s = s:sub(-digits) end\n  return s\nend"
- slug: hex
  name: hex()
  cat_tag: Data / Conversion
  description: Converts an integer to a hexadecimal string.
  related:
  - unhex
  - binary
  syntax: 'hex(v)

    hex(v, digits)'
  params:
  - name: v
    type: number
    desc: value to convert
  - name: digits
    type: number
    desc: number of digits (optional)
  returns: string
  uth:
  - - runner/src/prelude.lua
    - "-- ── Numbers as text ───────────────────────────────────────────────────────\n-- hex(255) -> \"FF\", hex(255, 6) -> \"0000FF\", unhex(\"FF\") -> 255\nfunction hex(n, digits)\n  if math.type(n) ~= \"integer\" then n = math.floor(n) end\n  local s = string.format(\"%X\", n & 0xFFFFFFFF)\n  if digits and #s < digits then s = string.rep(\"0\", digits - #s) .. s end\n  if digits and #s > digits then s = s:sub(-digits) end\n  return s\nend"
