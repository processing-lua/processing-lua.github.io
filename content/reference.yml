- slug: createShape
  name: createShape()
  cat_tag: Shape
  description: Creates a new PShape object. Optionally pass a kind constant.
  related:
  - loadShape
  - beginShape
  syntax: 'createShape()

    createShape(kind)'
  params:
  - name: kind
    type: number
    desc: 'shape kind (optional): POINTS, LINES, TRIANGLES, etc.'
  returns: PShape
  uth:
  - - runner/src/prelude.lua
    - "function createShape(kind, ...)\n  local s = setmetatable({ steps = {}, style = {}, moves = {}, children = {}, styled = true }, Made)\n  if kind == nil then return s end\n  if kind == GROUP then s.group = true return s end\n  local name = primitives[kind]\n  if not name then error(\"createShape(): unknown kind of shape\", 2) end\n  s.steps[1] = { name, ... }\n  return s\nend"
- slug: loadShape
  name: loadShape()
  cat_tag: Shape
  description: Loads geometry into a variable of type PShape. Supports SVG and OBJ files.
  related:
  - shape
  - createShape
  syntax: loadShape(path)
  params:
  - name: path
    type: string
    desc: path to the SVG or OBJ file
  returns: PShape
  uth:
  - - runner/src/prelude.lua
    - "function loadShape(path)\n  local id, w, h = load(path)\n  if id == 0 then return nil end\n  return setmetatable({ id = id, width = w, height = h }, Shape)\nend"
