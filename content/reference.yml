  cat_tag: Image / Loading & Displaying
  description: Sets the fill value for displaying images. Images can be tinted to specified colors.
  related:
  - noTint
  - image
  syntax: 'tint(gray)

    tint(gray, a)

    tint(r, g, b)

    tint(r, g, b, a)'
  params:
  - name: gray
    type: number
    desc: grayscale value
  - name: r
    type: number
    desc: red component
  - name: g
    type: number
    desc: green component
  - name: b
    type: number
    desc: blue component
  - name: a
    type: number
    desc: alpha (optional)
  returns: ''
  uth:
  - - runner/src/main.rs
    - "g.set(\"tint\", lua.create_function(|_, args: LuaMultiValue| {\n    let c = unpack_color(args);\n    processing::tint(c[0], c[1], c[2], c[3]); Ok(())\n})?)?;"
- slug: texture
  name: texture()
  cat_tag: Image / Textures
  description: Sets a texture to be applied to vertex points. Must be called between beginShape() and endShape().
  related:
  - textureMode
  - textureWrap
  - vertex
  syntax: texture(img)
  params:
  - name: img
    type: PImage
    desc: image to use as texture
  returns: ''
  uth:
  - - runner/src/prelude.lua
    - "function texture(img)\n  local mt = getmetatable(img)\n  if mt == MovieObj or mt == CaptureObj then return setTexture(img.img) end\n  return setTexture(img)\nend"
- slug: textureMode
  name: textureMode()
