  - millis
  syntax: delay(ms)
  params:
  - name: ms
    type: number
    desc: number of milliseconds to pause
  returns: ''
  uth:
  - - runner/src/main.rs
    - "g.set(\"delay\", lua.create_function(|_, ms: LuaValue| {\n    let ms = num(&ms, \"delay()\")?;\n    if ms.is_finite() && ms > 0.0 {\n        std::thread::sleep(std::time::Duration::from_millis(ms.min(60_000.0) as u64));\n    }\n    Ok(())\n})?)?;"
