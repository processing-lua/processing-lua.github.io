- slug: size
  name: size()
  cat_tag: Environment
  description: Defines the dimension of the display window. Call in setup(). Optionally pass P2D or P3D as renderer.
  related:
  - width
  - height
  - fullScreen
  syntax: 'size(w, h)

    size(w, h, renderer)'
  params:
  - name: w
    type: number
    desc: width of the window in pixels
  - name: h
    type: number
    desc: height of the window in pixels
  - name: renderer
    type: number
    desc: P2D or P3D (optional)
  returns: ''
  uth:
  - - runner/src/main.rs
    - "g.set(\"size\", lua.create_function(|lua, (w, h, r): (LuaValue, LuaValue, LuaValue)| {\n    let dim = |v: &LuaValue| -> LuaResult<u32> {\n        let n = num(v, \"size()\")?;\n        if !n.is_finite() || n < 1.0 {\n            return Err(LuaError::RuntimeError(\"size() needs a width and height of at least 1\".into()));\n        }\n        Ok((n.round() as u32).min(8192))\n    };\n    let (w, h) = (dim(&w)?, dim(&h)?);\n    processing::size(w, h);\n    lua.globals().raw_set(\"__renderer\", r)?;\n    lua.globals().raw_set(\"width\",  w)?;\n    lua.globals().raw_set(\"height\", h)?;\n    Ok(())\n})?)?;"
- slug: smooth
  name: smooth()
  cat_tag: Environment
  description: Draws all geometry with smooth (anti-aliased) edges. Enabled by default.
  related:
  - noSmooth
  syntax: smooth()
  params: []
  returns: ''
  uth:
  - - runner/src/main.rs
    - g.set("smooth",   lua.create_function(|_, ()| { processing::smooth(true);  Ok(()) })?)?;
