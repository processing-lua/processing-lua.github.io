- slug: pixels_arr
  name: pixels[]
  cat_tag: Image / Pixels
  description: Array containing the values for all the pixels in the display window or PImage. Must call loadPixels() before reading and updatePixels() after writing. Each value is a packed ARGB color integer. In Lua, pixels is counted from 0 like in Processing, so the same index math works.
  related:
  - loadPixels
  - updatePixels
  - get_pixel
  - set_pixel
  syntax: 'loadPixels()

    pixels[y * width + x] = color(255, 0, 0)

    updatePixels()'
  params: []
  returns: table
  uth: []
- slug: mask_fn
  name: mask()
  cat_tag: Image / Pixels
  description: Applies a mask to a PImage. The mask image is a grayscale image where white pixels are opaque and black pixels are transparent.
  related:
  - PImage_class
  - loadPixels
  - filter
  syntax: img:mask(maskImg)
  params:
  - name: maskImg
    type: PImage
    desc: the image whose brightness becomes the alpha
  returns: ''
  uth:
  - - runner/src/prelude.lua
    - function Image.mask(img, m) pixelsOf[img] = nil return imageMask(img, m) end
